name: Deploy to okrait.com

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Laravel App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, gd, json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Install Node dependencies and build assets
        run: |
          npm ci
          npm run build

      - name: Trigger deployment webhook
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://okrait.com/deploy.php" \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_SECRET }}" \
            --max-time 120)

          echo "Webhook response code: $RESPONSE"

          if [ "$RESPONSE" != "200" ]; then
            echo "Deployment webhook failed with status: $RESPONSE"
            exit 1
          fi

          echo "Deployment triggered successfully!"
